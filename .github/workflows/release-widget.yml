name: Publish widget release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm lint && pnpm fmt:check && pnpm build
      - name: Publish widget assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p release
            cp packages/doodle-phone/dist/index.html release/doodle-phone.html
            cp packages/linux/dist/index.html release/linux.html
            cp packages/linux/dist/*.bin packages/linux/dist/*.wasm packages/linux/dist/icon.svg packages/linux/dist/widgetfetch packages/linux/dist/micropython packages/linux/dist/micropython-LICENSE.txt packages/linux/dist/snake packages/linux/dist/snake-LICENSE.txt packages/linux/dist/btop packages/linux/dist/btop-LICENSE.txt release/
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "Widget Games ${GITHUB_SHA::7}" \
              --notes "Doodle Phone and Linux widget builds from ${GITHUB_SHA}. Serve linux.html with its .bin and .wasm assets in the same directory." \
              --latest
          fi
