name: Publish widget release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/prepare-release.mjs
      - name: Publish widget assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" release/matrix-widgets.zip \
              --target "$GITHUB_SHA" \
              --title "Matrix Widgets ${GITHUB_SHA::7}" \
              --notes "All Matrix widgets from ${GITHUB_SHA} in one ZIP. Extract and host the widget folders; each contains index.html and its companion files." \
              --latest
          fi
